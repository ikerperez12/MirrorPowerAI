name: CI

on:
  push:
    branches:
      - main
      - feat/windows-native
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS regression
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Swift release
        run: swift build -c release

  windows:
    name: Windows build, test, audit and publish
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Build, test and publish
        shell: pwsh
        # WDA verification needs a local interactive DWM desktop and is deliberately gated by -ReleaseGate.
        run: ./Windows/build.ps1

      - name: Verify formatting
        shell: pwsh
        run: dotnet format ./Windows/MirrorPowerAI.slnx --verify-no-changes --no-restore

      - name: List vulnerable dependencies
        shell: pwsh
        run: dotnet list ./Windows/MirrorPowerAI.slnx package --vulnerable --include-transitive

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
